# OpenAPI 3.0 skeleton for the Phase 1 HTTP surface (rooms, tokens, participants).
# Required root fields: https://spec.openapis.org/oas/v3.0.3.html#openapi-object
# Schema names match Task 4 Zod exports in packages/shared/src/*.ts.

openapi: "3.0.3"
info:
  title: SRU-Conf API
  description: >
    Phase 1–3 HTTP surface for rooms, tokens, recording, breakouts, API keys, and
    webhooks. Browser sessions use cookies. Integrations use HMAC headers.
  version: "3.0.0"
servers:
  - url: /
    description: Same origin as the Next.js app
tags:
  - name: rooms
    description: Create, list, read, and close rooms
  - name: tokens
    description: Mint a LiveKit access token for a room
  - name: participants
    description: List room participants
  - name: admin
    description: Organization administration
  - name: client
    description: In-meeting client telemetry
  - name: scim
    description: SCIM 2.0 user and group provisioning (RFC 7643/7644 subset)
paths:
  /api/v1/rooms:
    get:
      tags: [rooms]
      summary: List rooms the caller may see
      operationId: listRooms
      security:
        - session: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Rooms visible to the session user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoomSchema"
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        minimum: 1
                      pageSize:
                        type: integer
                        minimum: 1
                      totalItems:
                        type: integer
                        minimum: 0
                      totalPages:
                        type: integer
                        minimum: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [rooms]
      summary: Create a room
      operationId: createRoom
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequestSchema"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSchema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/rooms/{id}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [rooms]
      summary: Get one room
      operationId: getRoom
      security:
        - session: []
      responses:
        "200":
          description: Room found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSchema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [rooms]
      summary: Close a room
      operationId: deleteRoom
      security:
        - session: []
      responses:
        "204":
          description: Room closed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/rooms/{id}/tokens:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [tokens]
      summary: Mint a join token for a room
      operationId: createRoomToken
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequestSchema"
      responses:
        "201":
          description: Token minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponseSchema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/rooms/{id}/participants:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [participants]
      summary: List participants in a room
      operationId: listRoomParticipants
      security:
        - session: []
      responses:
        "200":
          description: Participants in the room
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoomParticipantSchema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/rooms/{id}/recording:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [rooms]
      summary: Current room recording
      operationId: getRoomRecording
      security:
        - session: []
        - hmac: []
      responses:
        "200":
          description: Current recording or null
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [rooms]
      summary: Request composite or track recording
      operationId: startRoomRecording
      security:
        - session: []
        - hmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRecordingRequestSchema"
      responses:
        "201":
          description: Recording created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSchema"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [rooms]
      summary: Stop the active recording
      operationId: stopRoomRecording
      security:
        - session: []
        - hmac: []
      responses:
        "200":
          description: Recording stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSchema"
  /api/v1/rooms/{id}/streaming:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [rooms]
      summary: Current room stream
      operationId: getRoomStreaming
      security:
        - session: []
        - hmac: []
      responses:
        "200":
          description: Current stream or null
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [rooms]
      summary: Request an RTMP room-composite stream
      operationId: startRoomStreaming
      security:
        - session: []
        - hmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartStreamRequestSchema"
      responses:
        "201":
          description: Stream created; may stay pending_consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamSchema"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    patch:
      tags: [rooms]
      summary: Add or remove an RTMP destination on the current stream
      operationId: updateRoomStreaming
      security:
        - session: []
        - hmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStreamRequestSchema"
      responses:
        "200":
          description: Stream destinations updated without restarting egress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamSchema"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [rooms]
      summary: Stop the active stream
      operationId: stopRoomStreaming
      security:
        - session: []
        - hmac: []
      responses:
        "200":
          description: Stream stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamSchema"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/rooms/{id}/breakouts:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [rooms]
      summary: Current breakout session for a parent room
      operationId: getRoomBreakouts
      security:
        - session: []
        - hmac: []
      responses:
        "200":
          description: Open session or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakoutSessionSchema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [rooms]
      summary: Open a breakout round on a parent room
      operationId: createRoomBreakouts
      security:
        - session: []
        - hmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBreakoutsRequestSchema"
      responses:
        "201":
          description: Breakout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakoutSessionSchema"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [rooms]
      summary: Close the open breakout session and child rooms
      operationId: closeRoomBreakouts
      security:
        - session: []
        - hmac: []
      responses:
        "200":
          description: Session closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakoutSessionSchema"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [rooms]
      summary: Broadcast, request help, recall, or claim a breakout room
      operationId: actOnRoomBreakouts
      security:
        - session: []
        - hmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreakoutActionRequestSchema"
      responses:
        "200":
          description: Packet sent to LiveKit rooms, or assignment after a claim
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BreakoutPacketSchema"
                  - $ref: "#/components/schemas/BreakoutAssignmentSchema"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/rooms/{id}/polls:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [rooms]
      summary: Open poll for a room
      operationId: getRoomPoll
      security:
        - session: []
        - hmac: []
      responses:
        "200":
          description: Open poll or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/PollSchema"
                      - type: "null"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [rooms]
      summary: Create a poll or cast a vote
      operationId: postRoomPoll
      security:
        - session: []
        - hmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CreatePollRequestSchema"
                - $ref: "#/components/schemas/VotePollRequestSchema"
      responses:
        "201":
          description: Poll created or vote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollSchema"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [rooms]
      summary: Close the open poll
      operationId: closeRoomPoll
      security:
        - session: []
        - hmac: []
      responses:
        "200":
          description: Poll closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollSchema"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/rooms/{id}/questions:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [rooms]
      summary: List room questions
      operationId: listRoomQuestions
      security:
        - session: []
        - hmac: []
      responses:
        "200":
          description: Questions visible in the room
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuestionSchema"
    post:
      tags: [rooms]
      summary: Submit a question
      operationId: submitRoomQuestion
      security:
        - session: []
        - hmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitQuestionRequestSchema"
      responses:
        "201":
          description: Question submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSchema"
    patch:
      tags: [rooms]
      summary: Moderate or upvote a question
      operationId: patchRoomQuestion
      security:
        - session: []
        - hmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerateQuestionRequestSchema"
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSchema"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/rooms/{id}/whiteboard:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [rooms]
      summary: Open whiteboard session
      operationId: getRoomWhiteboard
      security:
        - session: []
        - hmac: []
      responses:
        "200":
          description: Open session or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/WhiteboardSessionSchema"
                      - type: "null"
    post:
      tags: [rooms]
      summary: Open a whiteboard session
      operationId: openRoomWhiteboard
      security:
        - session: []
        - hmac: []
      responses:
        "201":
          description: Session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhiteboardSessionSchema"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [rooms]
      summary: Close the whiteboard session
      operationId: closeRoomWhiteboard
      security:
        - session: []
        - hmac: []
      responses:
        "200":
          description: Session closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhiteboardSessionSchema"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/keys:
    get:
      tags: [keys]
      summary: List API keys
      operationId: listApiKeys
      security:
        - session: []
      responses:
        "200":
          description: Keys for the session user
    post:
      tags: [keys]
      summary: Create an API key
      operationId: createApiKey
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequestSchema"
      responses:
        "201":
          description: Key created; secret shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApiKeyResponseSchema"
  /api/v1/webhooks:
    get:
      tags: [webhooks]
      summary: List webhook endpoints
      operationId: listWebhookEndpoints
      security:
        - session: []
      responses:
        "200":
          description: Endpoints for the session user
    post:
      tags: [webhooks]
      summary: Create a webhook endpoint
      operationId: createWebhookEndpoint
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookEndpointRequestSchema"
      responses:
        "201":
          description: Endpoint created; signing secret shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWebhookEndpointResponseSchema"
  /api/v1/recordings/{id}/transcript:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [recordings]
      summary: Get transcript for a finished recording
      operationId: getRecordingTranscript
      security:
        - session: []
      responses:
        "200":
          description: Transcript with segments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptSchema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/recordings/{id}/summary:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [recordings]
      summary: Get meeting summary for a transcript
      operationId: getRecordingSummary
      security:
        - session: []
      responses:
        "200":
          description: Meeting summary placeholder or generated body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingSummarySchema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/analytics/overview:
    get:
      tags: [admin]
      summary: Daily organization metrics overview
      operationId: getAnalyticsOverview
      security:
        - session: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily buckets and period totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverviewSchema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/admin/analytics/qos:
    get:
      tags: [admin]
      summary: Latest QoS report per room
      operationId: listRoomQosSummaries
      security:
        - session: []
      responses:
        "200":
          description: Latest QoS sample per room
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoomQosSummarySchema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /scim/v2/Users:
    get:
      tags: [scim]
      summary: List SCIM users
      description: >
        Returns active organization users. Supports `filter=userName eq "email@example.com"`.
        Authenticate with `Authorization: Bearer <scim token>` from the admin SCIM panel.
      operationId: listScimUsers
      security:
        - scimBearer: []
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            example: userName eq "alice@sru.ac.th"
      responses:
        "200":
          description: SCIM ListResponse of Users
          content:
            application/scim+json:
              schema:
                type: object
        "401":
          description: Missing or invalid bearer token
    post:
      tags: [scim]
      summary: Create SCIM user
      operationId: createScimUser
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
              required: [userName]
              properties:
                userName:
                  type: string
                  format: email
                externalId:
                  type: string
                name:
                  type: object
                  properties:
                    formatted:
                      type: string
                active:
                  type: boolean
      responses:
        "201":
          description: Created SCIM User
          content:
            application/scim+json:
              schema:
                type: object
        "401":
          description: Missing or invalid bearer token
        "409":
          description: User already exists
  /scim/v2/Users/{id}:
    get:
      tags: [scim]
      summary: Get SCIM user by id
      operationId: getScimUser
      security:
        - scimBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SCIM User
          content:
            application/scim+json:
              schema:
                type: object
        "401":
          description: Missing or invalid bearer token
        "404":
          description: User not found
    patch:
      tags: [scim]
      summary: Patch SCIM user
      operationId: patchScimUser
      security:
        - scimBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
      responses:
        "200":
          description: Updated SCIM User
        "401":
          description: Missing or invalid bearer token
        "404":
          description: User not found
    delete:
      tags: [scim]
      summary: Deprovision SCIM user
      description: Tombstones the user via PDPA deletion helper.
      operationId: deleteScimUser
      security:
        - scimBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User deprovisioned
        "401":
          description: Missing or invalid bearer token
        "404":
          description: User not found
  /scim/v2/Groups:
    get:
      tags: [scim]
      summary: List SCIM groups
      description: >
        Flat group list from SCIM_GROUP_ROLE_MAP for the single organization.
        Unknown groups are not returned.
      operationId: listScimGroups
      security:
        - scimBearer: []
      responses:
        "200":
          description: SCIM ListResponse of Groups
          content:
            application/scim+json:
              schema:
                type: object
        "401":
          description: Missing or invalid bearer token
  /scim/v2/Groups/{id}:
    patch:
      tags: [scim]
      summary: Patch SCIM group membership
      description: Adds or removes members; updates orgRole from SCIM_GROUP_ROLE_MAP.
      operationId: patchScimGroup
      security:
        - scimBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
      responses:
        "200":
          description: Updated SCIM Group
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Unknown group
  /api/v1/admin/scim-token:
    get:
      tags: [admin]
      summary: SCIM bearer token status
      operationId: getScimTokenMeta
      security:
        - session: []
      responses:
        "200":
          description: Whether a SCIM bearer token is configured
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: Generate or rotate SCIM bearer token
      description: Returns the plaintext token once; store it in the IdP tenant.
      operationId: upsertScimToken
      security:
        - session: []
      responses:
        "200":
          description: Plaintext token (display once)
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [admin]
      summary: Revoke SCIM bearer token
      operationId: revokeScimToken
      security:
        - session: []
      responses:
        "200":
          description: Token revoked
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/client/qos:
    post:
      tags: [client]
      summary: Submit periodic WebRTC QoS stats
      operationId: submitQosReport
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitQosReportRequestSchema"
      responses:
        "204":
          description: QoS report stored
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie issued after local login.
    hmac:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Pair with X-Api-Timestamp and X-Api-Signature HMAC-SHA256.
    scimBearer:
      type: http
      scheme: bearer
      description: >
        Organization SCIM token from Administration → SCIM provisioning.
        Sent as Authorization Bearer on /scim/v2/* (separate from session cookies).
  parameters:
    RoomId:
      name: id
      in: path
      required: true
      description: Room id
      schema:
        type: string
        minLength: 1
    RecordingId:
      name: id
      in: path
      required: true
      description: Recording id
      schema:
        type: string
        minLength: 1
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
  schemas:
    RoomRoleSchema:
      type: string
      enum: [host, cohost, participant]
    LobbyStatusSchema:
      type: string
      enum: [pending, admitted, denied]
    CreateRoomRequestSchema:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    RoomSchema:
      type: object
      required: [id, name, createdAt, ownerId]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 120
        createdAt:
          type: string
          format: date-time
        ownerId:
          type: string
          minLength: 1
    RoomParticipantSchema:
      type: object
      required: [id, roomId, userId, role, banned, lobbyStatus]
      properties:
        id:
          type: string
          minLength: 1
        roomId:
          type: string
          minLength: 1
        userId:
          type: string
          minLength: 1
        role:
          $ref: "#/components/schemas/RoomRoleSchema"
        banned:
          type: boolean
        lobbyStatus:
          $ref: "#/components/schemas/LobbyStatusSchema"
    TokenRequestSchema:
      type: object
      required: [roomName, identity]
      properties:
        roomName:
          type: string
          minLength: 1
          maxLength: 128
        identity:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 128
    TokenResponseSchema:
      type: object
      required: [token, url]
      properties:
        token:
          type: string
          minLength: 1
        url:
          type: string
          minLength: 1
    ApiErrorSchema:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1
            details: {}
    OrgRoleSchema:
      type: string
      enum: [org_admin, host, participant]
    LdapLoginRequestSchema:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    RecordingModeSchema:
      type: string
      enum: [composite, tracks]
    RecordingStatusSchema:
      type: string
      enum:
        - pending_consent
        - starting
        - active
        - finishing
        - finished
        - failed
    StartRecordingRequestSchema:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/RecordingModeSchema"
        trackIds:
          type: array
          items:
            type: string
    RecordingSchema:
      type: object
      required: [id, roomId, startedById, mode, status, createdAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        startedById:
          type: string
        mode:
          $ref: "#/components/schemas/RecordingModeSchema"
        status:
          $ref: "#/components/schemas/RecordingStatusSchema"
        createdAt:
          type: string
          format: date-time
    StartStreamRequestSchema:
      type: object
      properties:
        rtmpUrl:
          type: string
          minLength: 1
          maxLength: 2048
        rtmpUrls:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 2048
        hls:
          type: boolean
    UpdateStreamRequestSchema:
      type: object
      required: [action, rtmpUrl]
      properties:
        action:
          type: string
          enum: [add, remove]
        rtmpUrl:
          type: string
          minLength: 1
          maxLength: 2048
    StreamSchema:
      type: object
      required: [id, roomId, startedById, status, createdAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        startedById:
          type: string
        status:
          $ref: "#/components/schemas/RecordingStatusSchema"
        destinations:
          type: array
          items:
            type: string
        hlsPrefix:
          type: string
          nullable: true
        hlsUrl:
          type: string
          nullable: true
        consentedUserIds:
          type: array
          items:
            type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreateApiKeyRequestSchema:
      type: object
      required: [name]
      properties:
        name:
          type: string
    ApiKeyPublicSchema:
      type: object
      required: [id, name, keyId, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        keyId:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateApiKeyResponseSchema:
      type: object
      required: [id, name, keyId, createdAt, secret]
      properties:
        id:
          type: string
        name:
          type: string
        keyId:
          type: string
        createdAt:
          type: string
          format: date-time
        secret:
          type: string
    WebhookEventNameSchema:
      type: string
      enum:
        - room_started
        - room_finished
        - participant_joined
        - participant_left
        - recording_started
        - recording_finished
        - streaming_started
    CreateWebhookEndpointRequestSchema:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventNameSchema"
    WebhookEndpointSchema:
      type: object
      required: [id, url, events, active, createdAt]
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventNameSchema"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CreateWebhookEndpointResponseSchema:
      type: object
      required: [id, url, events, active, createdAt, secret]
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventNameSchema"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        secret:
          type: string
    AuditLogSchema:
      type: object
      required: [id, action, targetType, createdAt]
      properties:
        id:
          type: string
        action:
          type: string
        targetType:
          type: string
        createdAt:
          type: string
          format: date-time
    UserSchema:
      type: object
      required: [id, email, createdAt, updatedAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        orgRole:
          $ref: "#/components/schemas/OrgRoleSchema"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BreakoutAssignmentModeSchema:
      type: string
      enum: [auto, manual, self_pick]
    BreakoutSessionStatusSchema:
      type: string
      enum: [open, closed]
    CreateBreakoutsRequestSchema:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/BreakoutAssignmentModeSchema"
        count:
          type: integer
          minimum: 1
          maximum: 20
        durationSeconds:
          type: integer
          minimum: 60
          maximum: 14400
        assignments:
          type: array
          maxItems: 200
          items:
            type: object
            required: [userId, groupIndex]
            properties:
              userId:
                type: string
              groupIndex:
                type: integer
                minimum: 0
                maximum: 19
    BreakoutAssignmentSchema:
      type: object
      required: [userId, childRoomId]
      properties:
        userId:
          type: string
        childRoomId:
          type: string
    BreakoutSessionSchema:
      type: object
      required: [id, parentRoomId, status, assignmentMode, endsAt, createdAt]
      properties:
        id:
          type: string
        parentRoomId:
          type: string
        status:
          $ref: "#/components/schemas/BreakoutSessionStatusSchema"
        assignmentMode:
          $ref: "#/components/schemas/BreakoutAssignmentModeSchema"
        endsAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        childRoomIds:
          type: array
          items:
            type: string
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/BreakoutAssignmentSchema"
    BreakoutActionRequestSchema:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [broadcast, help, recall, claim]
        body:
          type: string
          minLength: 1
          maxLength: 500
        childRoomId:
          type: string
          minLength: 1
          maxLength: 128
    BreakoutPacketSchema:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [breakout.broadcast, breakout.help, breakout.recall]
        sessionId:
          type: string
        parentRoomId:
          type: string
        childRoomId:
          type: string
        userId:
          type: string
        senderId:
          type: string
        body:
          type: string
    PollStatusSchema:
      type: string
      enum: [open, closed]
    PollOptionSchema:
      type: object
      required: [id, label, voteCount]
      properties:
        id:
          type: string
        label:
          type: string
        voteCount:
          type: integer
          minimum: 0
    PollSchema:
      type: object
      required: [id, roomId, question, status, createdById, createdAt, closedAt, options]
      properties:
        id:
          type: string
        roomId:
          type: string
        question:
          type: string
        status:
          $ref: "#/components/schemas/PollStatusSchema"
        createdById:
          type: string
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOptionSchema"
        myVoteOptionId:
          type: string
          nullable: true
    CreatePollRequestSchema:
      type: object
      required: [question, options]
      properties:
        question:
          type: string
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: string
    VotePollRequestSchema:
      type: object
      required: [optionId]
      properties:
        optionId:
          type: string
    PollPacketSchema:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [poll.created, poll.voted, poll.closed]
    QuestionStatusSchema:
      type: string
      enum: [pending, answered, dismissed]
    QuestionSchema:
      type: object
      required: [id, roomId, userId, body, status, isPinned, answer, upvoteCount, createdAt, answeredAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        userId:
          type: string
        body:
          type: string
        status:
          $ref: "#/components/schemas/QuestionStatusSchema"
        isPinned:
          type: boolean
        answer:
          type: string
          nullable: true
        upvoteCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        answeredAt:
          type: string
          format: date-time
          nullable: true
        hasUpvoted:
          type: boolean
    SubmitQuestionRequestSchema:
      type: object
      required: [body]
      properties:
        body:
          type: string
    ModerateQuestionRequestSchema:
      type: object
      required: [action, questionId]
      properties:
        action:
          type: string
          enum: [pin, answer, dismiss, upvote]
        questionId:
          type: string
        value:
          type: boolean
        answer:
          type: string
    QaPacketSchema:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [qa.submitted, qa.updated]
    WhiteboardSessionStatusSchema:
      type: string
      enum: [open, closed]
    WhiteboardSessionSchema:
      type: object
      required: [id, roomId, status, openedById, snapshotKey, createdAt, closedAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        status:
          $ref: "#/components/schemas/WhiteboardSessionStatusSchema"
        openedById:
          type: string
        snapshotKey:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
    OpenWhiteboardRequestSchema:
      type: object
    CloseWhiteboardRequestSchema:
      type: object
      properties:
        snapshotPngBase64:
          type: string
    WhiteboardPacketSchema:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [whiteboard.opened, whiteboard.closed, whiteboard.sync]
    TranscriptStatusSchema:
      type: string
      enum: [pending, processing, finished, failed]
    MeetingSummaryStatusSchema:
      type: string
      enum: [not_configured, pending, finished, failed]
    TranscriptSegmentSchema:
      type: object
      required: [id, startMs, endMs, speakerLabel, text, sortOrder]
      properties:
        id:
          type: string
        startMs:
          type: integer
          minimum: 0
        endMs:
          type: integer
          minimum: 0
        speakerLabel:
          type: string
        text:
          type: string
        sortOrder:
          type: integer
          minimum: 0
    TranscriptSchema:
      type: object
      required: [id, recordingId, status, segments, createdAt, updatedAt]
      properties:
        id:
          type: string
        recordingId:
          type: string
        status:
          $ref: "#/components/schemas/TranscriptStatusSchema"
        language:
          type: string
          nullable: true
        segments:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSegmentSchema"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
    MeetingSummarySchema:
      type: object
      required: [id, transcriptId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        transcriptId:
          type: string
        status:
          $ref: "#/components/schemas/MeetingSummaryStatusSchema"
        bodyMarkdown:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TranscriptionSegmentInputSchema:
      type: object
      required: [startMs, endMs, speakerLabel, text]
      properties:
        startMs:
          type: integer
          minimum: 0
        endMs:
          type: integer
          minimum: 0
        speakerLabel:
          type: string
        text:
          type: string
    DailyOrgMetricsSchema:
      type: object
      required: [date, roomsCreated, participantMinutes, recordingsFinished, uniqueUsers]
      properties:
        date:
          type: string
          format: date
        roomsCreated:
          type: integer
          minimum: 0
        participantMinutes:
          type: integer
          minimum: 0
        recordingsFinished:
          type: integer
          minimum: 0
        uniqueUsers:
          type: integer
          minimum: 0
    AnalyticsTotalsSchema:
      type: object
      required: [roomsCreated, participantMinutes, recordingsFinished, uniqueUsers]
      properties:
        roomsCreated:
          type: integer
          minimum: 0
        participantMinutes:
          type: integer
          minimum: 0
        recordingsFinished:
          type: integer
          minimum: 0
        uniqueUsers:
          type: integer
          minimum: 0
    AnalyticsOverviewSchema:
      type: object
      required: [from, to, daily, totals]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        daily:
          type: array
          items:
            $ref: "#/components/schemas/DailyOrgMetricsSchema"
        totals:
          $ref: "#/components/schemas/AnalyticsTotalsSchema"
    SubmitQosReportRequestSchema:
      type: object
      required: [roomId]
      properties:
        roomId:
          type: string
        rttMs:
          type: integer
          minimum: 0
          nullable: true
        packetLoss:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        jitterMs:
          type: integer
          minimum: 0
          nullable: true
        bitrateKbps:
          type: integer
          minimum: 0
          nullable: true
    QosReportSchema:
      type: object
      required: [id, roomId, userId, createdAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        userId:
          type: string
        rttMs:
          type: integer
          minimum: 0
          nullable: true
        packetLoss:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        jitterMs:
          type: integer
          minimum: 0
          nullable: true
        bitrateKbps:
          type: integer
          minimum: 0
          nullable: true
        createdAt:
          type: string
          format: date-time
    RoomQosSummarySchema:
      type: object
      required: [roomId, roomName, latest, reportCount]
      properties:
        roomId:
          type: string
        roomName:
          type: string
        latest:
          allOf:
            - $ref: "#/components/schemas/QosReportSchema"
          nullable: true
        reportCount:
          type: integer
          minimum: 0
