# Local-only LiveKit config. Do not use these keys or node_ip settings in production.
# Config keys: official sample + deployment guide
#   https://github.com/livekit/livekit/blob/master/config-sample.yaml
#   https://docs.livekit.io/transport/self-hosting/deployment/
# Ports: https://docs.livekit.io/transport/self-hosting/ports-firewall/
# Local-dev API key/secret: https://docs.livekit.io/transport/self-hosting/local/

port: 7880
log_level: info

# Docker Desktop cannot use Linux host networking. Bind all interfaces inside
# the container so published host ports reach the process.
bind_addresses:
  - "0.0.0.0"

redis:
  address: redis:6379

# Key name matches official livekit-server --dev (`devkey`).
# Secret is 32+ characters (this server version logs an error for shorter secrets).
# Localhost only — rotate before any shared deploy.
# https://docs.livekit.io/transport/self-hosting/local/
keys:
  devkey: sru_livekit_local_dev_secret_do_not_use

rtc:
  tcp_port: 7881
  # Windows Docker Desktop cannot publish UDP 50000–60000: WinNAT/Hyper-V
  # excluded ranges overlap that block (bind denied on 53046 on this host).
  # Official mux: when udp_port is set, port_range_start/end are not used.
  # https://docs.livekit.io/transport/self-hosting/ports-firewall/
  # https://github.com/livekit/livekit/blob/master/config-sample.yaml
  udp_port: 7882
  # Advertise the Compose-network address (see docker-compose.yml ipv4_address).
  # 127.0.0.1 is reachable from the browser for signaling, but coturn inside
  # Docker cannot relay to loopback — it would hit itself. Host-mapped ICE/UDP
  # also fails on Docker Desktop, so local clients use TURN/TCP (below).
  use_external_ip: false
  node_ip: 172.19.0.10
  enable_loopback_candidate: false
  allow_tcp_fallback: true
  # External coturn on this Compose stack (not LiveKit embedded TURN).
  # TCP first: Windows Docker UDP publish is unreliable.
  turn_servers:
    - host: 127.0.0.1
      port: 3478
      protocol: tcp
      username: sru
      credential: sru_turn_local
    - host: 127.0.0.1
      port: 3478
      protocol: udp
      username: sru
      credential: sru_turn_local

# Embedded TURN stays off so published 3478/5349 belong to the coturn service.
turn:
  enabled: false
