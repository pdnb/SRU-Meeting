# Isolated LiveKit Egress worker. Never colocate this process with the SFU.
# Official config: https://docs.livekit.io/transport/self-hosting/egress/
# Local-dev keys match infra/livekit.yaml. Do not reuse in production.

log_level: info
api_key: devkey
api_secret: sru_livekit_local_dev_secret_do_not_use
ws_url: ws://livekit:7880
insecure: true
health_port: 8081
redis:
  address: redis:6379
s3:
  access_key: sru_minio
  secret: sru_minio_local_dev
  region: us-east-1
  endpoint: http://minio:9000
  bucket: sru-chat
  force_path_style: true
